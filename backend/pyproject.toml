[project]
name = "agent-zero-backend"
version = "0.1.0"
description = "Agent 0 investigation platform API and worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.140,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "pydantic-settings>=2.8,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.16,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "celery[redis]>=5.6,<6.0",
    "boto3>=1.35,<2.0",
    "openai>=3.24,<4.0",
    "openai-agents (>=0.0.19,<1.0)",
    "c2pa-python (>=0.38.0,<0.39.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9.0"
httpx = ">=0.27,<1.0"
ruff = ">=0.12,<1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
